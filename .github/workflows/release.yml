name: Release

# A tag `v<version>` (matching Cargo.toml) builds, tests and packages both
# architectures on native runners, combines them into a universal binary
# that is smoke-tested on both, then publishes a GitHub Release with the
# three archives and SHA256SUMS. Running the workflow by hand does everything
# except publishing, and keeps the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag: ${GITHUB_REF_NAME}, Cargo.toml: ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          sh scripts/release-notes.sh "${version}" > /dev/null

      # The full suite on this architecture, then a release build of every target.
      - name: Run scripts/check.sh
        run: sh scripts/check.sh

      - name: Smoke test the release binary
        run: sh scripts/smoke.sh target/${{ matrix.target }}/release/macclean

      - name: Package
        run: sh scripts/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macclean-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

      # The tested binary itself, for the universal build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/macclean
          if-no-files-found: error

  # One fat binary from the two tested thin ones. It is smoke-tested here as
  # arm64 (native) and x86_64 (Rosetta 2), and natively on Intel below.
  universal:
    name: Build universal binary
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: bins

      - name: lipo -create
        run: |
          mkdir -p universal
          lipo -create -output universal/macclean \
            bins/bin-aarch64-apple-darwin/macclean bins/bin-x86_64-apple-darwin/macclean
          chmod 755 universal/macclean
          lipo -archs universal/macclean
          file universal/macclean

      - name: Smoke test as arm64 (native)
        run: SMOKE_ARCH=arm64 sh scripts/smoke.sh universal/macclean

      - name: Smoke test as x86_64 (Rosetta 2)
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || softwareupdate --install-rosetta --agree-to-license
          SMOKE_ARCH=x86_64 sh scripts/smoke.sh universal/macclean

      - name: Package
        run: sh scripts/package.sh universal-apple-darwin universal/macclean

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macclean-universal-apple-darwin
          path: dist/
          if-no-files-found: error

  universal-intel:
    name: Smoke test universal binary on Intel
    needs: universal
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check native architecture
        run: test "$(uname -m)" = x86_64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macclean-universal-apple-darwin
          path: dist

      # The archive exactly as it will be published.
      - name: Verify, unpack and smoke test natively
        working-directory: dist
        run: |
          shasum -a 256 -c ./*.sha256
          tar -xzf ./*.tar.gz
          # Absolute, because smoke.sh changes to the repository root.
          bin="$PWD/$(find . -path '*universal-apple-darwin/macclean' -type f | sed 's|^\./||')"
          lipo -archs "$bin"
          SMOKE_ARCH=x86_64 sh ../scripts/smoke.sh "$bin"

  publish:
    name: Publish GitHub Release
    needs: [build, universal, universal-intel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macclean-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          shasum -a 256 -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "MacClean ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
