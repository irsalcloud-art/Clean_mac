name: Release

# A tag `v<version>` (matching Cargo.toml) builds, tests and packages both
# architectures on native runners, then publishes a GitHub Release with the
# two archives and SHA256SUMS. Running the workflow by hand does everything
# except publishing, and keeps the archives as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check native architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "tag: ${GITHUB_REF_NAME}, Cargo.toml: ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          sh scripts/release-notes.sh "${version}" > /dev/null

      # The full suite on this architecture, then a release build of every target.
      - name: Run scripts/check.sh
        run: sh scripts/check.sh

      - name: Smoke test the release binary
        run: sh scripts/smoke.sh target/${{ matrix.target }}/release/macclean

      - name: Package
        run: sh scripts/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: macclean-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: macclean-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          shasum -a 256 -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "MacClean ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
