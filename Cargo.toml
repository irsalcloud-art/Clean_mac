[package]
name = "macclean"
version = "0.1.4"
edition = "2024"
description = "MacClean: storage analyzer, safe cache cleaner and system monitor for macOS"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/irsalcloud-art/Clean_mac"
keywords = ["macos", "cleaner", "disk", "monitor", "cli"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
